name: ios-floor
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.2.app || true
      - name: Build CoreMLLLM for iOS at the lowered floor
        run: |
          xcodebuild -scheme CoreMLLLM -destination 'generic/platform=iOS'             IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -40
          exit ${PIPESTATUS[0]}
